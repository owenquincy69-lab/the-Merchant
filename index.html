 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#173d32">
    <meta name="description" content="Discover quality products at The Merchant.">
    <title>The Merchant | Online Store</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8f5ed;
            color: #173d32;
        }
        header {
            background: #173d32;
            color: #fff;
            padding: 22px 7%;
        }
        header h1 { margin: 0; }
        main {
            max-width: 900px;
            margin: 70px auto;
            padding: 24px;
            text-align: center;
        }
        h2 { font-size: 2rem; }
        p { line-height: 1.7; }
        a {
            display: inline-block;
            margin-top: 15px;
            padding: 13px 24px;
            background: #173d32;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <header>
        <h1>The Merchant</h1>
    </header>
    <main>
        <h2>Discover Your Next Favorite</h2>
        <p>Explore quality products and discover something you'll love.</p>
        <a href="#products">Explore the Store</a>
        <section id="products">
            <h2>Our Store</h2>
            <p>Our product collection will appear here.</p>
        </section>
    </main>
</body>
</html>
