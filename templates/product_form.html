
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Product | The Merchant</title>
</head>
<body>
  <h1>Add a product</h1>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}

  <form method="post" action="/admin/products" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <label>Product name
      <input name="name" maxlength="160" required>
    </label>

    <label>Category
      <input name="category" maxlength="80" required>
    </label>

    <label>Description
      <textarea name="description"></textarea>
    </label>

    <label>Price in KSh
      <input name="price" type="number" min="0.01" step="0.01" required>
    </label>

    <label>Stock quantity
      <input name="stock" type="number" min="0" step="1" value="0" required>
    </label>

    <label>Product image
      <input name="image" type="file" accept=".jpg,.jpeg,.png,.webp,.gif">
    </label>

    <label>Product video
      <input name="video" type="file" accept=".mp4,.webm,.mov">
    </label>

    <label>
      <input name="is_active" type="checkbox" checked>
      Publish on storefront
    </label>

    <button type="submit">Save product</button>
  </form>

  <p><a href="/admin">Back to product manager</a></p>
</body>
</html>
